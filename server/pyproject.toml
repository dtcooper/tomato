[tool.poetry]
name = "tomato"
version = "0.0.1-dev0"
description = "Tomato Radio Automation Server"
authors = ["David Cooper <david.cooper@burningman.org>"]
license = "MIT"
readme = "../README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
django = "^6.0"
django-admin-logs = "^1.5.0"
django-admin-notice = "^3.4.0"
django-constance = "^4.3.4"
django-dirtyfields = "^1.9.8"
django-environ = "^0.12.0"
django-file-form = "^4.0.0"
django-redis = {extras = ["hiredis"], version = "^6.0.0"}
django-simple-captcha = "^0.6.3"
django-user-messages = "^1.1.0"
django-widget-tweaks = "^1.5.0"
gunicorn = "^23.0.0"
huey = "^2.5.5"
pillow = "^12.0.0"
psycopg = "^3.3.2"
python-dotenv = "^1.2.1"
schema = "^0.7.8"
starlette = "^0.50.0"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
wait-for-it = "^2.3.0"

[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
django-debug-toolbar = "^6.1.0"
django-extensions = "^4.1"
flake8 = "^7.3.0"
ipdb = "^0.13.13"
ipython = "^9.8.0"
isort = "^7.0.0"
watchdog = {extras = ["watchmedo"], version = "^6.0.0"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py312"]
preview = true
enable-unstable-feature = [
    "multiline_string_handling", "string_processing", "wrap_long_dict_values_in_parens",
    "hug_parens_with_braces_and_square_brackets"
]

[tool.isort]
multi_line_output = 3
lines_after_imports = 2
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
force_sort_within_sections = true
combine_as_imports = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'DJANGO', 'STARLETTE', 'DJANGOTHIRDPARTY', 'FIRSTPARTY', 'LOCALFOLDER']
known_starlette = ['starlette', 'uvicorn']
known_django = ['django']
known_djangothirdparty = ['captcha', 'constance', 'dirtyfields', 'django_file_form', 'environ', 'django_redis',
                          'huey.contrib', 'safedelete', 'user_messages', 'widget_tweaks']
skip = ['migrations']
